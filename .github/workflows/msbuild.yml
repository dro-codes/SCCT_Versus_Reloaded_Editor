# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

#on:
#  push:
#    branches: [ "main", "dev" ]
#  pull_request:
#    branches: [ "main", "dev" ]
on:
  workflow_dispatch:
  
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "SCCT_Versus_Reloaded_Editor.sln"

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup vcpkg
      run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          cd ..

    - name: Install dependencies
      run: |
        vcpkg/vcpkg integrate install

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      # Reloaded.Editor.Mcp's build writes its Embedded.gen.h from Resources first.
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x86 /p:PlatformToolset=v143 ${{env.SOLUTION_FILE_PATH}} /t:Rebuild
    
    - name: Test recovery and grid shortcuts
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
        if errorlevel 1 exit /b 1
        call tools\test_map_recovery.cmd
        if errorlevel 1 exit /b 1
        cl /nologo /std:c++20 /W4 /WX /EHsc /O2 tests\GridSizeShortcutTests.cpp /Fo"%TEMP%\GridSizeShortcutTests.obj" /Fe"%TEMP%\GridSizeShortcutTests.exe"
        if errorlevel 1 exit /b 1
        "%TEMP%\GridSizeShortcutTests.exe"
        if errorlevel 1 exit /b 1

    - name: Test the MCP server
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
        if errorlevel 1 exit /b 1
        call tools\test_mcp.cmd
        if errorlevel 1 exit /b 1

    - name: MCP server self-test
      shell: cmd
      run: |
        bin\Reloaded.Editor.Mcp.exe --version
        if not "%errorlevel%"=="0" exit /b 1
        bin\Reloaded.Editor.Mcp.exe --self-test
        if not "%errorlevel%"=="0" exit /b 1

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check the embedded MCP resources
      # The Build step wrote Embedded.gen.h with embed_resources.ps1; the
      # Python script, which tools/test_mcp.sh uses, must write the same header.
      run: |
        python tools/mcp/embed_resources.py --output "$env:RUNNER_TEMP\Embedded.py.h"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if ((Get-FileHash "$env:RUNNER_TEMP\Embedded.py.h").Hash -ne (Get-FileHash Reloaded.Editor.Mcp\Embedded.gen.h).Hash) {
          Write-Error 'embed_resources.py and embed_resources.ps1 wrote different headers.'
          exit 1
        }

    - name: Get current date
      id: date
      run: '"current_date=$(Get-Date -Format yyyyMMddHHmmss)" >> $env:GITHUB_OUTPUT'

    - name: Package editor release
      run: ./tools/package_release.ps1

    - uses: actions/upload-artifact@v4
      with:
        # Name of the artifact to upload.
        # Optional. Default is 'artifact'
        name: Reloaded_Editor_Beta_${{ steps.date.outputs.current_date }}
    
        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        # package_release.ps1 names the archive after the version in Version.h.
        path: bin/Reloaded_Editor_Plus_v*.zip
    
        # The desired behavior if no files are found using the provided path.
        # Available Options:
        #   warn: Output a warning but do not fail the action
        #   error: Fail the action with an error message
        #   ignore: Do not output any warnings or errors, the action does not fail
        # Optional. Default is 'warn'
        if-no-files-found: error
    
        # Duration after which artifact will expire in days. 0 means using default retention.
        # Minimum 1 day.
        # Maximum 90 days unless changed from the repository settings page.
        # Optional. Defaults to repository settings.
        retention-days: 7
    
        # The level of compression for Zlib to be applied to the artifact archive.
        # The value can range from 0 to 9.
        # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
        # Optional. Default is '6'
        # compression-level:
    
        # If true, an artifact with a matching name will be deleted before a new one is uploaded.
        # If false, the action will fail if an artifact for the given name already exists.
        # Does not fail if the artifact does not exist.
        # Optional. Default is 'false'
        #overwrite:
